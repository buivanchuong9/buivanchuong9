<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#030712"/><stop offset=".52" stop-color="#07152E"/><stop offset="1" stop-color="#170B35"/>
    </linearGradient>
    <linearGradient id="neon" x1="240" y1="80" x2="960" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/><stop offset=".48" stop-color="#3B82F6"/><stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#2563EB" stop-opacity=".32"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7DD3FC" opacity=".13"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .ring1{transform-origin:600px 201px;animation:spin 22s linear infinite}
      .ring2{transform-origin:600px 201px;animation:back 15s linear infinite}
      .blink{animation:blink 2.2s ease-in-out infinite}
      .float1{animation:float 4.5s ease-in-out infinite}
      .float2{animation:float 4.5s ease-in-out -2.2s infinite}
      .scan{animation:scan 4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}@keyframes back{to{transform:rotate(-360deg)}}
      @keyframes blink{50%{opacity:.3}}@keyframes float{50%{transform:translateY(-10px)}}
      @keyframes scan{0%,100%{transform:translateY(-120px);opacity:0}40%,60%{opacity:.5}50%{transform:translateY(120px)}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="26" fill="url(#dots)"/>
  <ellipse cx="600" cy="200" rx="470" ry="250" fill="url(#halo)"/>
  <g opacity=".58" class="ring1">
    <ellipse cx="600" cy="201" rx="520" ry="142" fill="none" stroke="url(#neon)" stroke-width="1.4" stroke-dasharray="4 15"/>
    <circle cx="1112" cy="177" r="7" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="108" cy="250" r="5" fill="#C084FC" filter="url(#glow)"/>
  </g>
  <g opacity=".35" class="ring2">
    <ellipse cx="600" cy="201" rx="455" ry="112" fill="none" stroke="#60A5FA"/>
    <circle cx="1040" cy="230" r="5" fill="#F59E0B"/>
  </g>
  <path d="M96 67h130M96 67v44M1104 67H974M1104 67v44M96 333h130M96 333v-44M1104 333H974M1104 333v-44" stroke="url(#neon)" stroke-width="2" opacity=".65"/>
  <g class="float1">
    <rect x="75" y="147" width="140" height="48" rx="13" fill="#071426" stroke="#38BDF8" stroke-opacity=".7"/>
    <text x="145" y="177" text-anchor="middle" fill="#7DD3FC" font-family="monospace" font-size="17" font-weight="700">SWIFT </text>
  </g>
  <g class="float2">
    <rect x="985" y="147" width="140" height="48" rx="13" fill="#100C27" stroke="#A78BFA" stroke-opacity=".7"/>
    <text x="1055" y="177" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="17" font-weight="700">REACT ⚛</text>
  </g>
  <g transform="translate(600 86)" text-anchor="middle" font-family="Arial, sans-serif">
    <text fill="#64748B" font-size="14" font-weight="700" letter-spacing="7">SOFTWARE ENGINEER • VIETNAM</text>
    <text y="79" fill="url(#neon)" font-size="61" font-weight="900" filter="url(#glow)">BÙI VĂN CHƯƠNG</text>
    <text y="126" fill="#E2E8F0" font-size="21">iOS &amp; Web Developer</text>
    <text y="164" fill="#94A3B8" font-size="15" letter-spacing="2">SWIFT  /  REACT  /  NEXT.JS  /  TYPESCRIPT</text>
  </g>
  <g transform="translate(494 291)">
    <rect width="212" height="42" rx="21" fill="#071426" stroke="url(#neon)"/>
    <circle cx="27" cy="21" r="6" fill="#4ADE80" class="blink"/>
    <text x="121" y="27" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="700">ĐANG CODE...</text>
  </g>
  <rect x="110" y="80" width="980" height="2" fill="url(#neon)" opacity=".25" class="scan"/>
  <rect x="1" y="1" width="1198" height="398" rx="25" fill="none" stroke="url(#neon)" stroke-opacity=".52" stroke-width="2"/>
</svg>
