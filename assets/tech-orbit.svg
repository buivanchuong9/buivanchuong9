    <g transform="translate(850 72)"><circle r="56" fill="#172554" stroke="#60A5FA" stroke-width="2"/><text y="-3" fill="#93C5FD" font-size="19">BACKEND</text><text y="22" fill="#BFDBFE" font-size="12">Node • Data</text></g>
